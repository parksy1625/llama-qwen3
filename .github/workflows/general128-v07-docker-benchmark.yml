name: General-128 V0.7 Docker benchmark

on:
  push:
    branches: [general128-v07-docker]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: General-128 execution test
        run: |
          python -m py_compile general128_v07.py benchmark_general128_v07.py
          python general128_v07.py
          python benchmark_general128_v07.py --outdir smoke_results
          cat smoke_results/REPORT.md

      - name: Download Qwen2.5-0.5B Q4_K_M
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 --retry-delay 5 \
            -o qwen2.5-0.5b-instruct-q4_k_m.gguf \
            'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true'
          ACTUAL=$(stat -c%s qwen2.5-0.5b-instruct-q4_k_m.gguf)
          echo "actual_bytes=$ACTUAL" | tee qwen_model_identity.txt
          if [ "$ACTUAL" = '397808192' ]; then
            echo 'size_match_user_library=true' | tee -a qwen_model_identity.txt
          else
            echo 'size_match_user_library=false' | tee -a qwen_model_identity.txt
          fi
          sha256sum qwen2.5-0.5b-instruct-q4_k_m.gguf | tee -a qwen_model_identity.txt

      - name: Start prebuilt llama.cpp server container
        shell: bash
        run: |
          set -euxo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name qwen-server --network host \
            -v "$PWD:/models" \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            -c 8192 -t 2 --host 127.0.0.1 --port 8080
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo 'server-ready'
              exit 0
            fi
            sleep 2
          done
          docker logs qwen-server
          exit 1

      - name: Matched benchmark
        run: |
          python benchmark_general128_v07.py \
            --outdir benchmark_results \
            --qwen-endpoint http://127.0.0.1:8080/v1/chat/completions \
            | tee benchmark_stdout.txt
          cat benchmark_results/REPORT.md
          docker logs qwen-server > benchmark_results/llama_server.log 2>&1 || true
          cp qwen_model_identity.txt benchmark_results/qwen_model_identity.txt
          cp benchmark_stdout.txt benchmark_results/benchmark_stdout.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general128-v07-qwen05-docker-results
          path: |
            benchmark_results/
            smoke_results/
            qwen_model_identity.txt
          if-no-files-found: warn
