name: General-128 V0.8 quick check
on:
  push:
    branches: [general128-v08-quick]
  workflow_dispatch:
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3.0,<5' pyarrow
      - name: Download only Smol cortex
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o smol.gguf 'https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf?download=true'
      - name: Start Smol server
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name smol-server --network host -v "$PWD:/models" ghcr.io/ggml-org/llama.cpp:server -m /models/smol.gguf -c 8192 -t 2 --host 127.0.0.1 --port 8081
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1 && exit 0; sleep 2; done
          docker logs smol-server; exit 1
      - name: Quick Smol and V0.8 check
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PY' | tee quick_stdout.txt
          import json
          from benchmark_general128_v08_standard import run_base,run_hybrid,compact
          ep='http://127.0.0.1:8081/v1/chat/completions'; n=5; seed=20260906
          s=run_base(ep,n,seed,'SmolLM2-360M-Instruct-Q4_K_M')
          h=run_hybrid(ep,n,seed)
          out={'smol':compact(s),'v08':compact(h)}
          open('quick_results.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general128-v08-quick-results
          path: |
            quick_results.json
            quick_stdout.txt
          if-no-files-found: warn
