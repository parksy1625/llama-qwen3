name: General-128 V0.7 standard LLM sampled benchmark
on:
  push:
    branches: [general128-v07-fair]
  workflow_dispatch:

jobs:
  standard-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'datasets>=3.0,<5' pyarrow

      - name: Validate General-128 and benchmark harness
        run: |
          python -m py_compile general128_v07.py benchmark_llm_standard_v01.py
          python - <<'PY'
          from benchmark_llm_standard_v01 import probe_general128
          import json
          print(json.dumps(probe_general128(), indent=2))
          PY

      - name: Download Qwen2.5-0.5B-Instruct Q4_K_M
        run: |
          curl -L --fail --retry 4 --retry-delay 5 -o qwen.gguf 'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true'
          stat -c%s qwen.gguf | tee qwen_size.txt
          sha256sum qwen.gguf | tee qwen_sha256.txt

      - name: Start llama.cpp server
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name qwen-server --network host -v "$PWD:/models" ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen.gguf -c 8192 -t 2 --host 127.0.0.1 --port 8080
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo ready
              exit 0
            fi
            sleep 2
          done
          docker logs qwen-server
          exit 1

      - name: Run sampled standard benchmark
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python benchmark_llm_standard_v01.py \
            --endpoint http://127.0.0.1:8080/v1/chat/completions \
            --samples 30 \
            --seed 20260906 \
            --out standard_llm_results.json \
            | tee standard_llm_stdout.txt

      - name: Show compact result
        if: always()
        run: |
          if [ -f standard_llm_results.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('standard_llm_results.json'))
          print('General128:', x['general128'])
          for t in x['qwen']['tasks']:
              print(t['task'], t['correct'], '/', t['n'], '=', round(100*t['accuracy'],2), '%', 'parse', round(100*t['parse_rate'],2),'%')
          print('macro', round(100*x['qwen']['macro_accuracy'],2),'%')
          PY
          fi

      - name: Upload standard benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general128-v07-standard-llm-results
          path: |
            standard_llm_results.json
            standard_llm_stdout.txt
            qwen_size.txt
            qwen_sha256.txt
          if-no-files-found: warn
